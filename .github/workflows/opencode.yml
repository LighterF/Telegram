name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Faghat saheb-e repo (khodet) mitoone trigger kone
    if: |
      github.event.comment.author_association == 'OWNER' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # lazem baraye git push ba GITHUB_TOKEN (ba false, push "could not read Username" mide)
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-agent"
          git config --global user.email "opencode-agent@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Free model-e Zen. Age khata-ye "Model not found" dad, esm-e pishnahadi tuye log ro bezar
          # ya list ro tuye opencode.ai/docs/zen bebin (format: opencode/<model-id>)
          model: opencode/deepseek-v4.1-flash-free
          use_github_token: true
