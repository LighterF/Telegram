name: Build Official Telegram APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: "1"
  CCACHE_COMPILERCHECK: content
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK, CMake & ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Reset ccache stats
        run: |
          ccache -z
          ccache -s

      - name: Inject Secure API Credentials
        env:
          TG_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TG_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

          # secret ha bayad por va dorost bashan
          [[ "$TG_APP_ID" =~ ^[0-9]+$ ]] || { echo "TELEGRAM_APP_ID khali ya ghalat ast (faghat adad)"; exit 1; }
          [[ "$TG_APP_HASH" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "TELEGRAM_APP_HASH khali ya ghalat ast (32 character hex)"; exit 1; }

          sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${TG_APP_ID};/" "$F"
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"${TG_APP_HASH}\";/" "$F"
          sed -i "s/public static boolean SUPPORTS_PASSKEYS = .*/public static boolean SUPPORTS_PASSKEYS = false;/" "$F"

          # check: age sed chizi ro avaz nakarde bashe, fail kon
          grep -qF "APP_ID = ${TG_APP_ID};" "$F" || { echo "APP_ID inject nashod"; exit 1; }
          grep -qF "APP_HASH = \"${TG_APP_HASH}\";" "$F" || { echo "APP_HASH inject nashod"; exit 1; }
          grep -n "SUPPORTS_PASSKEYS" "$F" > /dev/null || echo "Hoshdar: SUPPORTS_PASSKEYS tuye file nist"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build Standalone Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleDebug \
            -PabiList=arm64-v8a \
            --build-cache \
            --stacktrace

      - name: Print ccache statistics
        if: always()
        run: ccache -s

      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}

      - name: Upload Telegram APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Official-Debug-APK
          retention-days: 1
          path: |
            **/build/outputs/apk/**/*.apk
