name: Build Official Telegram APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Licenses & Install NDK & ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.c', '**/*.h') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Standalone Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleDebug -PabiList=arm64-v8a --stacktrace

      - name: Upload Telegram APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Official-Debug-APK
          path: |
            **/build/outputs/apk/**/*.apk
